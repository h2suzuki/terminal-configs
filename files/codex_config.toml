# terminal-configs system defaults for codex CLI -> /etc/codex/config.toml
# User/project config and CLI options can override these defaults; this is not requirements.toml.
# Write-capable non-interactive defaults: /codex:rescue network + interactive codex TUI (no approval prompts).
model = "gpt-6-sol"
model_reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"
approval_policy = "never"

[sandbox_workspace_write]
network_access = true
# Use ~/worktrees/<repo>/<name> (the shared Claude Code / Codex layout).
# Recommended <name>: branch name or issue-<number>; naming is not enforced.
# Allow worktree creation and editing from a session started in the main repository.
# Codex expands ~ to the home directory of the user running it.
writable_roots = ["~/worktrees"]

[shell_environment_policy.filters]
TYPESAFE_API_KEY = "exclude"

# Explicit command exceptions are installed separately in
# rules/terminal-configs-sandbox-exclusions.rules; see that file for command entries.

# approval_policy = "never" rejects MCP tools left on the default approval mode.
[plugins."agent-coord@terminal-configs".mcp_servers.agent_coord]
default_tools_approval_mode = "approve"

# The Jev MCP process reads credentials outside tool-shell sandboxes.
[mcp_servers.jev]
command = "/usr/local/bin/jev"
args = ["serve"]
default_tools_approval_mode = "approve"
tool_timeout_sec = 60

[mcp_servers.mytask]
command = "/usr/local/bin/mytask"
args = ["--client", "codex"]
default_tools_approval_mode = "approve"

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]
default_tools_approval_mode = "approve"

# "writes" keeps deploys behind a prompt, which approval_policy = "never" rejects.
[mcp_servers.cloud-run]
command = "npx"
args = ["-y", "@google-cloud/cloud-run-mcp"]
default_tools_approval_mode = "writes"

# Disable Canva tools and their skill descriptions in Codex.
# Remote plugin enablement is account-managed, so disable skills by stable name.
[apps.connector_68df33b1a2d081918778431a9cfca8ba] # Canva
enabled = false

[skills]
config = [
    { name = "canva:canva-brand-check", enabled = false },
    { name = "canva:canva-branded-presentation", enabled = false },
    { name = "canva:canva-bulk-create", enabled = false },
    { name = "canva:canva-design-feedback", enabled = false },
    { name = "canva:canva-edit-design", enabled = false },
    { name = "canva:canva-implement-feedback", enabled = false },
    { name = "canva:canva-resize-for-social-media", enabled = false },
    { name = "canva:canva-translate-design", enabled = false },
]

[tui]
status_line = ["model-with-reasoning", "run-state", "current-dir", "git-branch", "context-used", "weekly-limit", "total-input-tokens", "total-output-tokens", "task-progress"]
status_line_use_colors = true

# System hooks are trusted by policy; /hooks shows the effective runtime state.
[[hooks.PreToolUse]]
matcher = "^(Bash|exec_command|shell_command|apply_patch|Write|Edit|MultiEdit|NotebookEdit)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/local/bin/scratch_file_management hook"
timeout = 30

# Before git commit, the connected jev server judges whether each added hunk fits its context.
[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "mcp_tool"
server = "jev"
tool = "context_gate"
input = { tool_input = "${tool_input}", cwd = "${cwd}", session_id = "${session_id}" }
timeout = 60

# Shared memory reminders; an empty match exits 0 silently and never blocks.
[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "/usr/local/bin/claude_memory_sync --pull"
timeout = 35

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 /etc/claude-code/skel/hooks/memory_surface.py --codex"
timeout = 10

# Prompt-time reminder to track multi-step work through mytask.
[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "python3 /etc/codex/hooks/plan_first_nudge.py --codex"
timeout = 5

# A write-failure claim at Stop retrieves the relevant Stop-routed lesson.
# It requests at most one continuation; unrelated or already-continued turns pass.
[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "python3 /etc/claude-code/skel/hooks/memory_surface.py --codex-stop"
timeout = 10

# Looking at a sandbox-covered file, or reading git's config-lock error as a held lock, gets a
# correction; the Stop check restates such a final answer at most once.
[[hooks.PreToolUse]]
matcher = "^(Bash|exec_command|shell_command)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /etc/claude-code/hooks/sandbox_shadow_nudge.py --codex"
timeout = 10

[[hooks.PostToolUse]]
matcher = "^(Bash|exec_command|shell_command)$"

[[hooks.PostToolUse.hooks]]
type = "command"
command = "python3 /etc/claude-code/hooks/sandbox_shadow_nudge.py --codex"
timeout = 10

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "python3 /etc/claude-code/hooks/sandbox_shadow_nudge.py --codex"
timeout = 10
