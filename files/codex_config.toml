# terminal-configs system defaults for codex CLI -> /etc/codex/config.toml
# User/project config and CLI options can override these defaults; this is not requirements.toml.
# Write-capable non-interactive defaults: /codex:rescue network + interactive codex TUI (no approval prompts).
sandbox_mode = "workspace-write"
approval_policy = "never"

[sandbox_workspace_write]
network_access = true
# Use ~/worktrees/<repo>/<name> (the shared Claude Code / Codex layout).
# Recommended <name>: branch name or issue-<number>; naming is not enforced.
# Allow worktree creation and editing from a session started in the main repository.
# Codex expands ~ to the home directory of the user running it.
writable_roots = ["~/worktrees"]
# Explicit command exceptions are installed separately in
# rules/terminal-configs-sandbox-exclusions.rules (see README for the mapping).

# approval_policy = "never" rejects MCP tools left on the default approval mode.
[plugins."agent-coord@terminal-configs".mcp_servers.agent_coord]
default_tools_approval_mode = "approve"

# Disable design app tools and their skill descriptions in Codex.
# Remote plugin enablement is account-managed, so disable skills by stable name.
[apps.connector_68df038e0ba48191908c8434991bbac2] # Figma
enabled = false

[apps.connector_68df33b1a2d081918778431a9cfca8ba] # Canva
enabled = false

[skills]
config = [
    { name = "canva:canva-brand-check", enabled = false },
    { name = "canva:canva-branded-presentation", enabled = false },
    { name = "canva:canva-bulk-create", enabled = false },
    { name = "canva:canva-design-feedback", enabled = false },
    { name = "canva:canva-edit-design", enabled = false },
    { name = "canva:canva-implement-feedback", enabled = false },
    { name = "canva:canva-resize-for-social-media", enabled = false },
    { name = "canva:canva-translate-design", enabled = false },
    { name = "figma:figma-code-connect", enabled = false },
    { name = "figma:figma-create-new-file", enabled = false },
    { name = "figma:figma-design-to-code", enabled = false },
    { name = "figma:figma-generate-design", enabled = false },
    { name = "figma:figma-generate-diagram", enabled = false },
    { name = "figma:figma-generate-library", enabled = false },
    { name = "figma:figma-generative-plugins", enabled = false },
    { name = "figma:figma-implement-motion", enabled = false },
    { name = "figma:figma-shaders", enabled = false },
    { name = "figma:figma-swiftui", enabled = false },
    { name = "figma:figma-use", enabled = false },
    { name = "figma:figma-use-figjam", enabled = false },
    { name = "figma:figma-use-motion", enabled = false },
    { name = "figma:figma-use-slides", enabled = false },
]

[tui]
status_line = ["model-with-reasoning", "run-state", "current-dir", "git-branch", "context-used", "weekly-limit", "total-input-tokens", "total-output-tokens", "task-progress"]
status_line_use_colors = true

# System hooks are trusted by policy; /hooks shows the effective runtime state.
[[hooks.PreToolUse]]
matcher = "^(Bash|exec_command|shell_command|apply_patch|Write|Edit|MultiEdit|NotebookEdit)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/usr/local/bin/workspace_hygiene hook"
timeout = 30
